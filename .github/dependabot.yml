version: 2
updates:
  # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot
  # proposes reviewed bumps so the pins don't go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
