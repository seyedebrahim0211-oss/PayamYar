name: PayamYar Android
'on':
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: payamyar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Install Persian font (OFL licensed)
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' --output assets/fonts/Vazirmatn.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/vazirmatn/OFL.txt' --output assets/fonts/OFL.txt
          # The font ships inside the signed APK: verify it byte-for-byte.
          printf '%s  %s\n' 696249a2c74b39ffdef55de4df2809c5b639d3ff80d618d8160a095d2fd49dca assets/fonts/Vazirmatn.ttf 17e355067c8284f47743a1ee3b1ef7ff684ff0601eda357f9353b10b3016ab31 assets/fonts/OFL.txt | sha256sum -c -
      - run: flutter create --project-name payamyar --org ir.honarmardomi --platforms android --no-overwrite .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          PAYAMYAR_PREVIEW_DIR: ${{ runner.temp }}/notification-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: notification-preview
          path: ${{ runner.temp }}/notification-preview/*.png
          if-no-files-found: error
          retention-days: 7
  overlay-ui:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Prepare Android UI test project
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' --output assets/fonts/Vazirmatn.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/vazirmatn/OFL.txt' --output assets/fonts/OFL.txt
          # The font ships inside the signed APK: verify it byte-for-byte.
          printf '%s  %s\n' 696249a2c74b39ffdef55de4df2809c5b639d3ff80d618d8160a095d2fd49dca assets/fonts/Vazirmatn.ttf 17e355067c8284f47743a1ee3b1ef7ff684ff0601eda357f9353b10b3016ab31 assets/fonts/OFL.txt | sha256sum -c -
          flutter create --project-name payamyar --org ir.honarmardomi --platforms android --no-overwrite .
          printf '\napply(from = "payamyar.gradle")\n' >> android/app/build.gradle.kts
          flutter pub get
          sudo chmod 666 /dev/kvm
      - name: Test real overlay windows, long text, privacy and stop on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: floating-ui-test-results
          path: build/app/reports/androidTests/
          if-no-files-found: ignore
  android:
    needs: analyze
    # Signing secrets live in the 'release' environment, which only main may use, so a
    # workflow_dispatch from another branch can't read the permanent key. PRs build with
    # a throwaway key in an unprotected environment.
    environment: ${{ github.event_name == 'pull_request' && 'pr-validation' || 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Install Persian font (OFL licensed)
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' --output assets/fonts/Vazirmatn.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/vazirmatn/OFL.txt' --output assets/fonts/OFL.txt
          # The font ships inside the signed APK: verify it byte-for-byte.
          printf '%s  %s\n' 696249a2c74b39ffdef55de4df2809c5b639d3ff80d618d8160a095d2fd49dca assets/fonts/Vazirmatn.ttf 17e355067c8284f47743a1ee3b1ef7ff684ff0601eda357f9353b10b3016ab31 assets/fonts/OFL.txt | sha256sum -c -
      - run: flutter create --project-name payamyar --org ir.honarmardomi --platforms android --no-overwrite .
      - name: Apply PayamYar Gradle settings (minSdk, release signing)
        shell: bash
        run: |
          f=android/app/build.gradle.kts
          if [ -f "$f" ]; then
            printf '\napply(from = "payamyar.gradle")\n' >> "$f"
          else
            f=android/app/build.gradle
            printf "\napply from: 'payamyar.gradle'\n" >> "$f"
          fi
          tail -n 3 "$f"
      - run: flutter pub get

      - name: Verify release build with disposable test-only signing key (never publish)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PAYAMYAR_KEYSTORE_PATH="$RUNNER_TEMP/ci-validation-only.p12"
          export PAYAMYAR_KEYSTORE_PASSWORD="CIOnlyValidation2026"
          export PAYAMYAR_KEY_ALIAS="ci-validation-only"
          export PAYAMYAR_KEY_PASSWORD="CIOnlyValidation2026"
          keytool -genkeypair -noprompt -storetype PKCS12 -keyalg RSA -keysize 2048 \
            -validity 1 -alias "$PAYAMYAR_KEY_ALIAS" \
            -keystore "$PAYAMYAR_KEYSTORE_PATH" \
            -storepass "$PAYAMYAR_KEYSTORE_PASSWORD" -keypass "$PAYAMYAR_KEY_PASSWORD" \
            -dname "CN=CI Build Test Only, O=PayamYar"
          flutter build apk --release
          # Same identity checks as the official build, so they are proven before a release relies on them.
          aapt="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          badging="$("$aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | head -n 1)"
          echo "$badging"
          want_name="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\1/p' pubspec.yaml)"
          want_code="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\2/p' pubspec.yaml)"
          echo "$badging" | grep -q "name='ir.honarmardomi.payamyar'" || { echo "::error::Wrong applicationId"; exit 1; }
          echo "$badging" | grep -q "versionCode='$want_code'" || { echo "::error::versionCode is not $want_code"; exit 1; }
          echo "$badging" | grep -q "versionName='$want_name'" || { echo "::error::versionName is not $want_name"; exit 1; }
          signer="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$signer" verify --verbose build/app/outputs/flutter-apk/app-release.apk | grep "Verified using v2 scheme (APK Signature Scheme v2): true"
          # Disposable APK is not exported or published. Production always requires
          # pinned GitHub Secrets and the original permanent private key.
          rm -f "$PAYAMYAR_KEYSTORE_PATH"
          rm -rf build/app/outputs/flutter-apk

      - name: Verify permanent release key and pinned public certificate
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PAYAMYAR_KEYSTORE_BASE64 }}
          PAYAMYAR_KEYSTORE_PASSWORD: ${{ secrets.PAYAMYAR_KEYSTORE_PASSWORD }}
          PAYAMYAR_KEY_ALIAS: ${{ secrets.PAYAMYAR_KEY_ALIAS }}
          PAYAMYAR_KEY_PASSWORD: ${{ secrets.PAYAMYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PAYAMYAR_KEYSTORE_PASSWORD" ] ||
             [ -z "$PAYAMYAR_KEY_ALIAS" ] || [ -z "$PAYAMYAR_KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing secrets missing. See docs/RELEASE_SIGNING_FA.md. No fallback key will be used."
            exit 1
          fi
          export PAYAMYAR_KEYSTORE_PATH="$RUNNER_TEMP/payamyar-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PAYAMYAR_KEYSTORE_PATH"
          chmod 600 "$PAYAMYAR_KEYSTORE_PATH"
          actual="$(keytool -exportcert -storetype PKCS12 -keystore "$PAYAMYAR_KEYSTORE_PATH" -alias "$PAYAMYAR_KEY_ALIAS" -storepass "$PAYAMYAR_KEYSTORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          expected="$(tr -d '\r\n' < .github/payamyar-release-cert.sha256)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signing certificate changed. Release halted to prevent Android upgrade failure."
            exit 1
          fi
          echo "PAYAMYAR_KEYSTORE_PATH=$PAYAMYAR_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Pinned release signer certificate verified."

      - name: Build APK with permanent release signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PAYAMYAR_KEYSTORE_PASSWORD: ${{ secrets.PAYAMYAR_KEYSTORE_PASSWORD }}
          PAYAMYAR_KEY_ALIAS: ${{ secrets.PAYAMYAR_KEY_ALIAS }}
          PAYAMYAR_KEY_PASSWORD: ${{ secrets.PAYAMYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # External Maven/Gradle mirrors sometimes return HTTP 429. Retry only
          # the build step; never bypass signing, identity or APK checks.
          for attempt in 1 2 3 4; do
            if flutter build apk --release; then break; fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Release Gradle build failed after four attempts."
              exit 1
            fi
            echo "::warning::Gradle build failed (possible Maven 429); retry $attempt/3 with backoff."
            sleep $((15 * attempt))
          done
          cp build/app/outputs/flutter-apk/app-release.apk dist/PayamYar-release.apk
          signer="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$signer" ] || [ ! -x "$signer" ]; then
            echo "::error::Android apksigner unavailable; cannot verify APK identity."
            exit 1
          fi
          "$signer" verify --verbose --print-certs dist/PayamYar-release.apk > "$RUNNER_TEMP/apk-verify.txt"
          actual="$(awk -F': ' '/[Ss]igner.*certificate SHA-256 digest/{print toupper($NF); exit}' "$RUNNER_TEMP/apk-verify.txt" | tr -d ': \r\n')"
          expected="$(tr -d '\r\n' < .github/payamyar-release-cert.sha256)"
          grep -E "Signer|scheme|certificate" "$RUNNER_TEMP/apk-verify.txt" || true
          if [ "$actual" != "$expected" ]; then
            echo "::error::Built APK is signed with the wrong certificate ($actual, expected $expected); abort release."
            exit 1
          fi
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apk-verify.txt"; then
            echo "::error::APK Signature Scheme v2 missing; Android 7+ upgrade path is not guaranteed."
            exit 1
          fi
          # Package identity and versionCode must match pubspec.yaml exactly.
          aapt="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          badging="$("$aapt" dump badging dist/PayamYar-release.apk | head -n 1)"
          echo "$badging"
          want_name="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\1/p' pubspec.yaml)"
          want_code="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\2/p' pubspec.yaml)"
          echo "$badging" | grep -q "name='ir.honarmardomi.payamyar'" || { echo "::error::Wrong applicationId"; exit 1; }
          echo "$badging" | grep -q "versionCode='$want_code'" || { echo "::error::versionCode is not $want_code"; exit 1; }
          echo "$badging" | grep -q "versionName='$want_name'" || { echo "::error::versionName is not $want_name"; exit 1; }
          sha256sum dist/PayamYar-release.apk | awk '{print $1"  PayamYar-'"$want_name"'.apk"}' > dist/PayamYar-release.apk.sha256
          cp dist/PayamYar-release.apk "dist/PayamYar-$want_name.apk"
          {
            echo "### PayamYar $want_name ($want_code)"
            echo "- Signer SHA-256: \`$actual\`"
            echo "- APK SHA-256: \`$(cut -d' ' -f1 dist/PayamYar-release.apk.sha256)\`"
            echo "- Size: $(stat -c %s dist/PayamYar-release.apk) bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Android release APK signed by the pinned permanent certificate."

      - name: Build Cafe Bazaar and Myket editions (store updates only, no self-install)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PAYAMYAR_KEYSTORE_PASSWORD: ${{ secrets.PAYAMYAR_KEYSTORE_PASSWORD }}
          PAYAMYAR_KEY_ALIAS: ${{ secrets.PAYAMYAR_KEY_ALIAS }}
          PAYAMYAR_KEY_PASSWORD: ${{ secrets.PAYAMYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          want_name="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\1/p' pubspec.yaml)"
          manifest=android/app/src/main/AndroidManifest.xml
          cp "$manifest" "$RUNNER_TEMP/AndroidManifest.site.xml"
          # Stores forbid apps that download/install APKs: drop the permission; the Dart side
          # (PAYAMYAR_STORE) hides the updater and points to the store page instead.
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' "$manifest"
          if grep -q REQUEST_INSTALL_PACKAGES "$manifest"; then echo "::error::Could not remove install permission"; exit 1; fi
          aapt="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          signer="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          expected="$(tr -d '\r\n' < .github/payamyar-release-cert.sha256)"
          for store in bazaar myket; do
            for attempt in 1 2 3 4; do
              if flutter build apk --release --dart-define=PAYAMYAR_STORE=$store; then break; fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Store edition $store Gradle build failed after four attempts."
                exit 1
              fi
              echo "::warning::Gradle build for $store failed (possible Maven 429); retry $attempt/3."
              sleep $((15 * attempt))
            done
            label="$( [ "$store" = bazaar ] && echo Bazaar || echo Myket )"
            out="dist/PayamYar-$label-$want_name.apk"
            cp build/app/outputs/flutter-apk/app-release.apk "$out"
            if "$aapt" dump permissions "$out" | grep -q REQUEST_INSTALL_PACKAGES; then
              echo "::error::$label APK still requests REQUEST_INSTALL_PACKAGES"; exit 1
            fi
            actual="$("$signer" verify --verbose --print-certs "$out" | awk -F': ' '/[Ss]igner.*certificate SHA-256 digest/{print toupper($NF); exit}' | tr -d ': \r\n')"
            [ "$actual" = "$expected" ] || { echo "::error::$label APK signed with wrong certificate"; exit 1; }
            sha256sum "$out" | awk '{print $1"  '"$(basename "$out")"'"}' >> dist/PayamYar-stores.sha256
            echo "- $label: \`$(basename "$out")\` ($(stat -c %s "$out") bytes)" >> "$GITHUB_STEP_SUMMARY"
          done
          cp "$RUNNER_TEMP/AndroidManifest.site.xml" "$manifest"

      - name: Native notification geometry and security unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Remove temporary private signing material
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: rm -f "$RUNNER_TEMP/payamyar-release.p12" "$RUNNER_TEMP/apk-verify.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: PayamYar-Android
          path: |
            dist/PayamYar-release.apk
            dist/PayamYar-*.apk
            dist/PayamYar-release.apk.sha256
            dist/PayamYar-stores.sha256
          if-no-files-found: error
      # Publishing is exclusively managed in the WordPress dashboard:
      # https://honarmardomi.ir/wp-admin/admin.php?page=payamyar-releases
      # Do not overwrite the public release manifest from a CI build.
  github_release:
    name: Publish signed Android APK to Releases
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [android, overlay-ui]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PayamYar-Android
          path: release-apk
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          test -n "$VERSION"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create official GitHub release with signed APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          name: پیامیار Android v${{ steps.version.outputs.number }} (رسمی)
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: 'true'
          generate_release_notes: false
          body_path: RELEASE_NOTES_FA.txt
          files: |
            release-apk/PayamYar-${{ steps.version.outputs.number }}.apk
            release-apk/PayamYar-release.apk.sha256
            release-apk/PayamYar-Bazaar-${{ steps.version.outputs.number }}.apk
            release-apk/PayamYar-Myket-${{ steps.version.outputs.number }}.apk
            release-apk/PayamYar-stores.sha256
          fail_on_unmatched_files: true

  site_publish:
    name: Publish to honarmardomi.ir (site download + in-app update)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: github_release
    # Pushes an in-app update to every user: requires a manual approval in GitHub.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PayamYar-Android
          path: release-apk
      - name: Upload signed APK to honarmardomi.ir and send in-app update
        shell: bash
        env:
          WP_SECRET: ${{ secrets.PAYAMYAR_WP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WP_SECRET" ]; then
            echo "::warning::PAYAMYAR_WP_SECRET is not set; honarmardomi.ir publishing skipped (see the PayamYar release panel)."
            exit 0
          fi
          VERSION="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          APK="release-apk/PayamYar-$VERSION.apk"
          SIGNER="$(tr -d '\r\n' < .github/payamyar-release-cert.sha256)"
          API="https://honarmardomi.ir/wp-json/payamyar/v1"
          TOTAL="$(stat -c %s "$APK")"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SESSION="$(openssl rand -hex 16)"
          WORK="$(mktemp -d)"
          split -b 1048576 -d -a 4 "$APK" "$WORK/part_"
          sign() { printf '%s\n%s\n%s' "$1" "$2" "$3" | openssl dgst -sha256 -hmac "$WP_SECRET" -r | cut -d' ' -f1; }
          i=0
          for part in "$WORK"/part_*; do
            for attempt in 1 2 3 4 5; do
              TS="$(date +%s)"
              BH="$(sha256sum "$part" | cut -d' ' -f1)"
              SIG="$(sign "$TS" "$SESSION"$'\n'"$i" "$BH")"
              if curl -sS --fail-with-body -X POST "$API/ci/chunk?session=$SESSION&index=$i&total=$TOTAL" \
                  -H "X-PayamYar-Time: $TS" -H "X-PayamYar-Signature: $SIG" \
                  -H "Content-Type: application/octet-stream" --data-binary @"$part" -o "$WORK/reply.json"; then
                break
              fi
              cat "$WORK/reply.json" 2>/dev/null || true
              if [ "$attempt" = 5 ]; then echo "::error::Uploading part $i to honarmardomi.ir failed."; exit 1; fi
              sleep $((attempt * 5))
            done
            i=$((i + 1))
          done
          NOTES="$(awk '/^---/{exit} {print}' RELEASE_NOTES_FA.txt | python3 -c 'import sys; print(sys.stdin.read()[:1800])')"
          BODY="$(jq -cn --arg s "$SESSION" --arg v "$VERSION" --argjson t "$TOTAL" --arg h "$SHA" --arg g "$SIGNER" --arg n "$NOTES" \
            '{session:$s, version:$v, total:$t, sha256:$h, signer:$g, notes:$n}')"
          TS="$(date +%s)"
          SIG="$(sign "$TS" "finish" "$(printf '%s' "$BODY" | sha256sum | cut -d' ' -f1)")"
          curl -sS --fail-with-body -X POST "$API/ci/finish" \
            -H "X-PayamYar-Time: $TS" -H "X-PayamYar-Signature: $SIG" \
            -H "Content-Type: application/json" --data-binary "$BODY"
          echo
          echo "### honarmardomi.ir: PayamYar $VERSION published (site download + in-app update)" >> "$GITHUB_STEP_SUMMARY"
