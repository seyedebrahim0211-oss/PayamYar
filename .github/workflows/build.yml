name: PayamYar Android
'on':
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: payamyar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Install Persian font (OFL licensed)
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' --output assets/fonts/Vazirmatn.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/OFL.txt' --output assets/fonts/OFL.txt
      - run: flutter create --project-name payamyar --org ir.honarmardomi --platforms android --no-overwrite .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  android:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Install Persian font (OFL licensed)
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' --output assets/fonts/Vazirmatn.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/OFL.txt' --output assets/fonts/OFL.txt
      - run: flutter create --project-name payamyar --org ir.honarmardomi --platforms android --no-overwrite .
      - name: Apply PayamYar Gradle settings (minSdk, release signing)
        shell: bash
        run: |
          f=android/app/build.gradle.kts
          if [ -f "$f" ]; then
            printf '\napply(from = "payamyar.gradle")\n' >> "$f"
          else
            f=android/app/build.gradle
            printf "\napply from: 'payamyar.gradle'\n" >> "$f"
          fi
          tail -n 3 "$f"
      - run: flutter pub get

      - name: Verify release build with disposable test-only signing key (never publish)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PAYAMYAR_KEYSTORE_PATH="$RUNNER_TEMP/ci-validation-only.p12"
          export PAYAMYAR_KEYSTORE_PASSWORD="CIOnlyValidation2026"
          export PAYAMYAR_KEY_ALIAS="ci-validation-only"
          export PAYAMYAR_KEY_PASSWORD="CIOnlyValidation2026"
          keytool -genkeypair -noprompt -storetype PKCS12 -keyalg RSA -keysize 2048 \
            -validity 1 -alias "$PAYAMYAR_KEY_ALIAS" \
            -keystore "$PAYAMYAR_KEYSTORE_PATH" \
            -storepass "$PAYAMYAR_KEYSTORE_PASSWORD" -keypass "$PAYAMYAR_KEY_PASSWORD" \
            -dname "CN=CI Build Test Only, O=PayamYar"
          flutter build apk --release
          # Same identity checks as the official build, so they are proven before a release relies on them.
          aapt="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          badging="$("$aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | head -n 1)"
          echo "$badging"
          want_name="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\1/p' pubspec.yaml)"
          want_code="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\2/p' pubspec.yaml)"
          echo "$badging" | grep -q "name='ir.honarmardomi.payamyar'" || { echo "::error::Wrong applicationId"; exit 1; }
          echo "$badging" | grep -q "versionCode='$want_code'" || { echo "::error::versionCode is not $want_code"; exit 1; }
          echo "$badging" | grep -q "versionName='$want_name'" || { echo "::error::versionName is not $want_name"; exit 1; }
          signer="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$signer" verify --verbose build/app/outputs/flutter-apk/app-release.apk | grep "Verified using v2 scheme (APK Signature Scheme v2): true"
          # Disposable APK is not exported or published. Production always requires
          # pinned GitHub Secrets and the original permanent private key.
          rm -f "$PAYAMYAR_KEYSTORE_PATH"
          rm -rf build/app/outputs/flutter-apk

      - name: Verify permanent release key and pinned public certificate
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PAYAMYAR_KEYSTORE_BASE64 }}
          PAYAMYAR_KEYSTORE_PASSWORD: ${{ secrets.PAYAMYAR_KEYSTORE_PASSWORD }}
          PAYAMYAR_KEY_ALIAS: ${{ secrets.PAYAMYAR_KEY_ALIAS }}
          PAYAMYAR_KEY_PASSWORD: ${{ secrets.PAYAMYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PAYAMYAR_KEYSTORE_PASSWORD" ] ||
             [ -z "$PAYAMYAR_KEY_ALIAS" ] || [ -z "$PAYAMYAR_KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing secrets missing. See docs/RELEASE_SIGNING_FA.md. No fallback key will be used."
            exit 1
          fi
          export PAYAMYAR_KEYSTORE_PATH="$RUNNER_TEMP/payamyar-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PAYAMYAR_KEYSTORE_PATH"
          chmod 600 "$PAYAMYAR_KEYSTORE_PATH"
          actual="$(keytool -exportcert -storetype PKCS12 -keystore "$PAYAMYAR_KEYSTORE_PATH" -alias "$PAYAMYAR_KEY_ALIAS" -storepass "$PAYAMYAR_KEYSTORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          expected="$(tr -d '\r\n' < .github/payamyar-release-cert.sha256)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signing certificate changed. Release halted to prevent Android upgrade failure."
            exit 1
          fi
          echo "PAYAMYAR_KEYSTORE_PATH=$PAYAMYAR_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Pinned release signer certificate verified."

      - name: Build APK with permanent release signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PAYAMYAR_KEYSTORE_PASSWORD: ${{ secrets.PAYAMYAR_KEYSTORE_PASSWORD }}
          PAYAMYAR_KEY_ALIAS: ${{ secrets.PAYAMYAR_KEY_ALIAS }}
          PAYAMYAR_KEY_PASSWORD: ${{ secrets.PAYAMYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/PayamYar-release.apk
          signer="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$signer" ] || [ ! -x "$signer" ]; then
            echo "::error::Android apksigner unavailable; cannot verify APK identity."
            exit 1
          fi
          "$signer" verify --verbose --print-certs dist/PayamYar-release.apk > "$RUNNER_TEMP/apk-verify.txt"
          actual="$(awk -F': ' '/[Ss]igner.*certificate SHA-256 digest/{print toupper($NF); exit}' "$RUNNER_TEMP/apk-verify.txt" | tr -d ': \r\n')"
          expected="$(tr -d '\r\n' < .github/payamyar-release-cert.sha256)"
          grep -E "Signer|scheme|certificate" "$RUNNER_TEMP/apk-verify.txt" || true
          if [ "$actual" != "$expected" ]; then
            echo "::error::Built APK is signed with the wrong certificate ($actual, expected $expected); abort release."
            exit 1
          fi
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apk-verify.txt"; then
            echo "::error::APK Signature Scheme v2 missing; Android 7+ upgrade path is not guaranteed."
            exit 1
          fi
          # Package identity and versionCode must match pubspec.yaml exactly.
          aapt="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          badging="$("$aapt" dump badging dist/PayamYar-release.apk | head -n 1)"
          echo "$badging"
          want_name="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\1/p' pubspec.yaml)"
          want_code="$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\2/p' pubspec.yaml)"
          echo "$badging" | grep -q "name='ir.honarmardomi.payamyar'" || { echo "::error::Wrong applicationId"; exit 1; }
          echo "$badging" | grep -q "versionCode='$want_code'" || { echo "::error::versionCode is not $want_code"; exit 1; }
          echo "$badging" | grep -q "versionName='$want_name'" || { echo "::error::versionName is not $want_name"; exit 1; }
          sha256sum dist/PayamYar-release.apk | awk '{print $1"  PayamYar-'"$want_name"'.apk"}' > dist/PayamYar-release.apk.sha256
          cp dist/PayamYar-release.apk "dist/PayamYar-$want_name.apk"
          {
            echo "### PayamYar $want_name ($want_code)"
            echo "- Signer SHA-256: \`$actual\`"
            echo "- APK SHA-256: \`$(cut -d' ' -f1 dist/PayamYar-release.apk.sha256)\`"
            echo "- Size: $(stat -c %s dist/PayamYar-release.apk) bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Android release APK signed by the pinned permanent certificate."

      - name: Remove temporary private signing material
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: rm -f "$RUNNER_TEMP/payamyar-release.p12" "$RUNNER_TEMP/apk-verify.txt"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: PayamYar-Android
          path: |
            dist/PayamYar-release.apk
            dist/PayamYar-*.apk
            dist/PayamYar-release.apk.sha256
          if-no-files-found: error
      # Publishing is exclusively managed in the WordPress dashboard:
      # https://honarmardomi.ir/wp-admin/admin.php?page=payamyar-releases
      # Do not overwrite the public release manifest from a CI build.
  github_release:
    name: Publish signed Android APK to Releases
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PayamYar-Android
          path: release-apk
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          test -n "$VERSION"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create official GitHub release with signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          name: پیامیار Android v${{ steps.version.outputs.number }} (رسمی)
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: 'true'
          generate_release_notes: false
          body_path: RELEASE_NOTES_FA.txt
          files: |
            release-apk/PayamYar-${{ steps.version.outputs.number }}.apk
            release-apk/PayamYar-release.apk.sha256
          fail_on_unmatched_files: true

