name: PayamYar Android and Windows (preview)
'on':
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name payamyar --org ir.honarmardomi --platforms android,windows --no-overwrite .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name payamyar --org ir.honarmardomi --platforms android --no-overwrite .
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: PayamYar-Android-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
  windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter create --project-name payamyar --org ir.honarmardomi --platforms windows --no-overwrite .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: PayamYar-Windows-preview
          path: build/windows/x64/runner/Release/
