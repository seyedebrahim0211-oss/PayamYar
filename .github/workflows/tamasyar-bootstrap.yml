name: TamasYar one-time private signer bootstrap
'on':
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tamasyar-bootstrap.yml'
      - 'tamasyar/bootstrap-encryption-cert.pem'
permissions:
  contents: read
concurrency:
  group: tamasyar-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  generate-signed-candidate:
    if: github.event.pull_request.head.ref == 'feature/tamasyar-standalone-dialer'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tamasyar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android build environment and encryption recipient
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          openssl x509 -in bootstrap-encryption-cert.pem -noout -checkend 0
      - name: Prepare Persian app font
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' --output app/src/main/assets/Vazirmatn.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/OFL.txt' --output app/src/main/assets/OFL.txt
      - name: Run lint and unit tests
        run: gradle :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Create a fresh permanent production key and sign version 0.3.0
        env:
          TMP_PATH: ${{ runner.temp }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$TMP_PATH/tamasyar-backup" bootstrap-output
          export TAMASYAR_KEYSTORE_PATH="$TMP_PATH/tamasyar-backup/tamasyar-release.p12"
          export TAMASYAR_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export TAMASYAR_KEY_ALIAS="tamasyar"
          export TAMASYAR_KEY_PASSWORD="$TAMASYAR_KEYSTORE_PASSWORD"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$TAMASYAR_KEYSTORE_PATH" -storepass "$TAMASYAR_KEYSTORE_PASSWORD" -keypass "$TAMASYAR_KEY_PASSWORD" -alias "$TAMASYAR_KEY_ALIAS" -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 15000 -dname "CN=TamasYar,OU=Mobile,O=HonarMardomi,C=IR" >/dev/null 2>&1
          cert_sha="$(keytool -exportcert -storetype PKCS12 -keystore "$TAMASYAR_KEYSTORE_PATH" -alias "$TAMASYAR_KEY_ALIAS" -storepass "$TAMASYAR_KEYSTORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          gradle :app:assembleRelease --no-daemon --stacktrace
          apk="app/build/outputs/apk/release/app-release.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          "$signer" verify --verbose --print-certs "$apk" > "$TMP_PATH/tamasyar-verify.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$TMP_PATH/tamasyar-verify.txt"
          actual="$(awk -F': ' '/[Ss]igner.*certificate SHA-256 digest/{print toupper($NF); exit}' "$TMP_PATH/tamasyar-verify.txt" | tr -d ': \r\n')"
          test "$actual" = "$cert_sha"
          badging="$("$aapt" dump badging "$apk" | head -n 1)"
          echo "$badging" | grep -q "name='ir.honarmardomi.tamasyar'"
          echo "$badging" | grep -q "versionCode='3'"
          echo "$badging" | grep -q "versionName='0.3.0'"
          {
            printf 'TAMASYAR_KEYSTORE_PASSWORD=%s\n' "$TAMASYAR_KEYSTORE_PASSWORD"
            printf 'TAMASYAR_KEY_ALIAS=%s\n' "$TAMASYAR_KEY_ALIAS"
            printf 'TAMASYAR_KEY_PASSWORD=%s\n' "$TAMASYAR_KEY_PASSWORD"
            printf 'TAMASYAR_RELEASE_CERT_SHA256=%s\n' "$cert_sha"
          } > "$TMP_PATH/tamasyar-backup/secrets.env"
          tar -C "$TMP_PATH/tamasyar-backup" -cf "$TMP_PATH/tamasyar-signing-backup.tar" tamasyar-release.p12 secrets.env
          openssl cms -encrypt -binary -aes256 -in "$TMP_PATH/tamasyar-signing-backup.tar" -out bootstrap-output/tamasyar-signing-backup.cms -outform DER -recip bootstrap-encryption-cert.pem
          rm -f "$TMP_PATH/tamasyar-signing-backup.tar" "$TMP_PATH/tamasyar-backup/secrets.env" "$TAMASYAR_KEYSTORE_PATH"
          echo "APK SHA-256: $(sha256sum "$apk" | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing certificate SHA-256: $cert_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Permanent signing key is only available as an encrypted archive." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TamasYar-0.3.0-signed-candidate
          path: tamasyar/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload only encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: TamasYar-0.3.0-encrypted-signing-backup
          path: tamasyar/bootstrap-output/tamasyar-signing-backup.cms
          if-no-files-found: error
          retention-days: 30
