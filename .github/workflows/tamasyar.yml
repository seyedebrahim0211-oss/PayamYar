name: TamasYar Android
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tamasyar/**'
      - '.github/workflows/tamasyar.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tamasyar/**'
      - '.github/workflows/tamasyar.yml'
permissions:
  contents: read
concurrency:
  group: tamasyar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tamasyar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android 35 SDK on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Install shared Vazirmatn font from the licensed original source
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' --output app/src/main/assets/Vazirmatn.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/OFL.txt' --output app/src/main/assets/OFL.txt
          test -s app/src/main/assets/Vazirmatn.ttf
      - name: Android lint and JVM test checks
        run: gradle :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build test APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TamasYar-test-only
          path: tamasyar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build release only with a permanent, separate signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.TAMASYAR_KEYSTORE_BASE64 }}
          TAMASYAR_KEYSTORE_PASSWORD: ${{ secrets.TAMASYAR_KEYSTORE_PASSWORD }}
          TAMASYAR_KEY_ALIAS: ${{ secrets.TAMASYAR_KEY_ALIAS }}
          TAMASYAR_KEY_PASSWORD: ${{ secrets.TAMASYAR_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.TAMASYAR_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$TAMASYAR_KEYSTORE_PASSWORD" ] || [ -z "$TAMASYAR_KEY_ALIAS" ] || [ -z "$TAMASYAR_KEY_PASSWORD" ] || [ -z "$CERT_SHA256" ]; then
            echo "::error::TamasYar permanent signing key or pinned certificate is not configured. Nothing will be published."
            exit 1
          fi
          umask 077
          export TAMASYAR_KEYSTORE_PATH="$RUNNER_TEMP/tamasyar.p12"
          trap 'rm -f "$TAMASYAR_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$TAMASYAR_KEYSTORE_PATH"
          actual="$(keytool -exportcert -storetype PKCS12 -keystore "$TAMASYAR_KEYSTORE_PATH" -alias "$TAMASYAR_KEY_ALIAS" -storepass "$TAMASYAR_KEYSTORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          expected="$(printf '%s' "$CERT_SHA256" | tr -d ': \r\n' | tr 'a-f' 'A-F')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::TamasYar signing certificate changed. Abort to protect in-place updates."
            exit 1
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          apk="app/build/outputs/apk/release/app-release.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signing.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/signing.txt"
          actual_apk="$(awk -F': ' '/[Ss]igner.*certificate SHA-256 digest/{print toupper($NF); exit}' "$RUNNER_TEMP/signing.txt" | tr -d ': \r\n')"
          if [ "$actual_apk" != "$expected" ]; then
            echo "::error::Built APK certificate differs from the pinned signing identity."
            exit 1
          fi
          badging="$("$aapt" dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='ir.honarmardomi.tamasyar'"
          echo "$badging" | grep -q "versionCode='2'"
          echo "$badging" | grep -q "versionName='0.2.0'"
          echo "APK SHA-256: $(sha256sum "$apk" | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate SHA-256: $expected" >> "$GITHUB_STEP_SUMMARY"
          echo "Public publishing remains disabled until real-device acceptance tests pass." >> "$GITHUB_STEP_SUMMARY"
      - name: Export separately signed release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TamasYar-release-candidate
          path: tamasyar/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14
