name: payamyar
description: Persian SMS messenger for Android
publish_to: none
version: 3.0.23+63
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.2
  html: ^0.15.7
  audioplayers: ^6.8.1
  http: ^1.4.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.1
  file_picker: ^13.3.3
  path_provider: ^2.1.5
  crypto: ^3.0.6
  scrollable_positioned_list: ^0.3.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/banks/
    - assets/payamyar-mark.webp
    - assets/dialect.json
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf

